<!doctype html>
<html lang="en">

<body>
<title>Last Pass</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>

    user-select:none; -webkit-user-select:none; }
  #gear { position:fixed; top:10px; right:12px; z-index:20; width:44px; height:44px;
    border:1px solid rgba(255,255,255,.18); border-radius:10px; background:rgba(16,22,35,.7);
    color:#8fa3c0; font-size:22px; line-height:1; cursor:pointer; }
  #gear .dot { position:absolute; top:5px; right:5px; width:10px; height:10px; border-radius:50%;
    background:#ff5d5d; display:none; }
  #gear.unseen .dot { display:block; }
  #log { position:fixed; inset:0; z-index:30; display:none; overflow-y:auto;
    background:rgba(11,15,25,.97); color:#cfd9ea; padding:28px 22px 90px;
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif; }
  #log.open { display:block; }
  #log h2 { margin:0 0 18px; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:#ffd166; }
  #log .entry { max-width:560px; margin:0 auto 22px; }
  #log h3 { margin:0 0 2px; font-size:16px; color:#5fd9e8; letter-spacing:.06em; }
  #log .date { font-size:12px; color:#7d8aa3; margin-bottom:6px; }
  #log ul { margin:0; padding-left:18px; }
  #log li { font-size:14px; margin-bottom:4px; line-height:1.35; }
  #logclose { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:31;
    padding:10px 34px; font:inherit; font-size:14px; letter-spacing:.1em; text-transform:uppercase;
    color:#cfd9ea; background:rgba(95,217,232,.15); border:1px solid rgba(95,217,232,.5);
    border-radius:8px; cursor:pointer; display:none; }
  #log.open + #logclose { display:block; }
  #gear:focus-visible { outline:2px solid #5fd9e8; }
  #panel { position:fixed; top:0; right:0; bottom:0; z-index:19; width:270px; padding:56px 16px 16px;
    background:rgba(13,18,30,.94); border-left:1px solid rgba(95,217,232,.25); color:#cfd9ea;

  #panel h2 { margin:0 0 4px; font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:#5fd9e8; }

<div id="panel">

<script>
'use strict';
/* =============================================================
   LAST PASS — the focused build.
   An endless climb up switchback platforms. Three slings per landing,
   each air sling weaker than the last. Touch anything to reload.
   No deaths: the only enemy (for now) is the long way down.

   World scale is defined in jump units — TIERS are the platform rises
   for a clean single, a committed double, and a crisp triple, set to
   ~75% of the measured chain ceilings (444 / 733 / 918px). If gravity,
   maxThrow or airDecay change, re-measure and reset TIERS.

   Roadmap: ninja sprite (aim-crouch / tuck / skid) -> sentry enemies
   (spotted = knocked down, never killed) -> catch floors every ~250m
   -> mission gates every 10,000 ft.
   ============================================================= */
const CFG = {
  gravity:     2300,
  slingPower:  7,
  maxThrow:    1500,
  restitution: 0.4,
  damping:     0.2,
  rollFric:    0.006,
  groundFric:  6,
  airDecay:    0.8,
  ballR:       31,
  jumps:       3,
};
const TUNE = [
  ['gravity','Gravity',1000,3600,50],
  ['slingPower','Sling power',3,16,0.5],
  ['maxThrow','Max launch speed',800,4000,50],
  ['restitution','Bounciness',0.1,0.95,0.05],
  ['damping','Air drag',0,0.7,0.02],
  ['groundFric','Ground friction',0,12,0.5],
  ['airDecay','Air jump decay',0.4,1,0.05],
  ['ballR','Ball size',14,40,1],
  ['jumps','Jumps per landing',1,5,1],
];
const PULL_MAX = 270;
const TIERS = [330, 560, 720];

/* Every deploy adds an entry here (newest first) and bumps VERSION.
   `highlights` is the curated line playtesters see on the title screen. */
const VERSION = '0.11.2';
const CHANGELOG = [
  { v: '0.11.2', date: 'Aug 5', title: 'No stopping the clock',
    highlights: [],
    items: [ 'Pausing during the redo window now forfeits the offer — the decision only exists in real time. (Slow motion is already your thinking time.)' ] },
  { v: '0.11.1', date: 'Aug 5', title: 'Watch the window close',
    highlights: [],
    items: [ 'The redo decision window now visibly drains under the button — cyan while you have time, red when you don’t. Choose faster.' ] },
  { v: '0.11', date: 'Aug 5', title: 'Pinball paddles',
    highlights: ['NEW: PINBALL PADDLES — SOME FRIENDLY, SOME VICIOUS'],
    items: [
      'Pivoting paddles appear from The High Sky up, swiping on their own clock. Brass ones bat you skyward. Steel ones sweep sideways. The pink ones slam DOWN — and the ones with a red pivot swing fast.',
      'Every paddle glows for a beat before it swipes — that’s your warning.',
      'A paddle is still a surface: any touch reloads your slings, even a slam.',
      'Springs got serious: they now launch you higher than a full triple chain, slings loaded. Be happy to see them.' ] },
  { v: '0.10', date: 'Aug 5', title: 'Redo hearts & a pretend store',
    highlights: ['REDO HEARTS ON SCREEN', 'OUT OF REDOS? A (FAKE) $0.99 OFFER — TELL US HOW IT FEELS'],
    items: [
      'Your redos are now hearts in the top corner — three per climb, plus any pack redos you hold.',
      'Out of redos during a big fall? The slow-motion moment now shows a purchase offer instead.',
      'IT IS NOT REAL: tapping it charges nothing and grants the 5 redos with a test-mode note. We want to know how that moment feels — would you have paid? Tell Max.' ] },
  { v: '0.9', date: 'Aug 5', title: 'The redo moment',
    highlights: ['NEW: REDO — UNDO A CATASTROPHIC FALL, 3 PER CLIMB'],
    items: [
      'When you’re out of slings, falling, and the landing is projected to cost you more than 120m, time slows and you get the choice: redo the last jump, or ride it out.',
      'Redo returns you to your last footing with full slings. You get 3 per climb — spend them on the falls that matter.',
      'Redos are free. This is a mechanic, not a store.',
      'Lost at the bottom after a fall? Pulsing edge arrows now point back to the tower.' ] },
  { v: '0.8', date: 'Aug 5', title: 'Wall-climb sections',
    highlights: ['NEW: WALL LADDERS — PING-PONG UP THE SLABS TO A SAFE DECK'],
    items: [
      'From The Cloudbank up, some stretches of the tower are ladders of staggered wall slabs: kiss one, sling, kiss the next — a vertical sprint capped by a wide safe deck.',
      'Coins hug the walls to show the line.' ] },
  { v: '0.7', date: 'Aug 5', title: 'Slopes and wall slabs',
    highlights: ['NEW: SLOPES IN THE MOON’S REACH', 'WALL SLABS TO KISS MID-AIR — ANY SURFACE RELOADS'],
    items: [
      'Sloped platforms arrive in The Moon’s Reach: land on one and you slowly slide toward the low edge — no free rests up there.',
      'Thin vertical wall slabs float beside the route from The Cloudbank up. Touching any surface reloads your slings — bank off a wall mid-air to extend a chain.',
      'A new final zone, The Beyond, mixes every block the tower has.',
      'Tutorial is now three beats: single, double, triple jump.' ] },
  { v: '0.6', date: 'Aug 5', title: 'A tutorial you can actually read',
    highlights: ['BIGGER, CLEARER HOW-TO-PLAY'],
    items: [
      'The how-to-play card is now big and front-and-centre instead of whispering at the bottom of the screen.',
      'The double-jump step explains the three-sling system directly, and your sling dots grow with a spotlight while they’re the lesson.',
      'Tip added: air slings are weaker — time them at the top of your arc.' ] },
  { v: '0.5', date: 'Aug 5', title: 'First-moves tutorial',
    highlights: ['NEW PLAYERS: EARN YOUR SINGLE, DOUBLE & TRIPLE JUMP'],
    items: [
      'A four-step first-moves chain teaches the mechanic: First Sling, Clean Landing, Double Jump, Triple Jump — one objective at a time, confetti when you graduate.',
      'Shows once per device, then stays out of your way.',
      'Clearer title-screen instructions for first-time players.' ] },
  { v: '0.4.1', date: 'Aug 5', title: 'The ground is now actually the ground',
    highlights: [],
    items: [ 'Fixed: falling far off to the side could miss the edge of the ground and drop you into the void forever. The ground is now infinite, as advertised.' ] },
  { v: '0.4', date: 'Aug 5', title: 'Zones & block types',
    highlights: ['ZONES EVERY 500m WITH CELEBRATIONS', 'NEW BLOCKS: MOVERS, CRUMBLERS, PHANTOMS, SPRINGS'],
    items: [
      'Zones are chapters: crossing a boundary fires confetti, a fanfare, and a banner announcing the zone’s new block.',
      'Moving platforms (blue) patrol side to side — and you ride them.',
      'Crumbling platforms (brown) shake for half a second after you land, then collapse. They grow back after a few seconds.',
      'Phantom platforms (white) vanish 0.6s after first touch — one composed sling each. They also return.',
      'Spring pads launch you hard, free of charge, slings fully reloaded.',
      'The big altitude number is now live — it unwinds as you fall. Run peak has its own readout, top right.',
      'Stars now arrive with the Starfield zone instead of at a hardcoded altitude.' ] },
  { v: '0.3', date: 'Aug 5', title: 'Permanent home',
    highlights: [],
    items: [ 'The game now lives at gitstud.github.io/last-pass — the link is permanent and always current.' ] },
  { v: '0.2', date: 'Aug 4', title: 'The focused build',
    highlights: [],
    items: [
      'Fresh start around the validated mechanic: three slings per landing, each air sling weaker (80% of the last).',
      'Platform rises come in three exact tiers: a clean single, a committed double, a crisp triple.',
      'Character-style skid: horizontal speed dies quickly on the ground.',
      'Solid ground floor and zero deaths — the only enemy is the long way down.' ] },
  { v: '0.1', date: 'Aug 2–4', title: 'The exploration era',
    highlights: [],
    items: [ 'Thumb-catch pong, slingshot mini golf, an endless climber, a corridor dungeon, and a zigzag tower — five prototypes in three days, distilled into this game.' ] },
];

/* First-moves tutorial: sequential achievements that teach the mechanic.
   Shown until completed once on this device (lp-tut-done). */
const TUT = [
  { key: 'single', name: 'SINGLE JUMP',
    lines: ['PULL BACK ANYWHERE ON SCREEN, LIKE A SLINGSHOT — RELEASE TO FLY.', 'LAND ON A PLATFORM. LANDING REFILLS YOUR SLINGS.'] },
  { key: 'double', name: 'DOUBLE JUMP',
    lines: ['THE BLUE DOTS ABOVE YOU ARE YOUR SLINGS — YOU CARRY 3.', 'FIRE ONE MID-AIR: THAT’S A DOUBLE JUMP.'] },
  { key: 'triple', name: 'TRIPLE JUMP',
    lines: ['NOW CHAIN ALL 3 BEFORE LANDING.', 'EACH AIR SLING IS WEAKER — TIME THEM AT THE TOP OF YOUR ARC.'] },
];
let tutIdx = null;   // resolved after sGet is defined; -1 = done
function tutComplete(key){
  if (tutIdx === null || tutIdx < 0 || TUT[tutIdx].key !== key) return;
  parts.push({ x: ball.x, y: ball.y - 100, t: 0, txt: '✓ ' + TUT[tutIdx].name, col: '#7fe3a0' });
  sfx(660, 990, 0.15, 'sine', 0.2);
  tutIdx++;
  if (tutIdx >= TUT.length) {
    tutIdx = -1;
    sSet('lp-tut-done', '1');
    parts.push({ x: ball.x, y: ball.y - 150, t: 0, txt: 'YOU HAVE THE MOVES — CLIMB!', col: '#ffd166' });
    for (let i = 0; i < 30; i++)
      confetti.push({ x: ball.x + rnd(-40, 40), y: ball.y - 40, vx: rnd(-450, 450), vy: rnd(-750, -100),
                      s: rnd(4, 8), t: 0, col: ['#ffd166', '#5fd9e8', '#7fe3a0'][i % 3] });
    sfx(523, 523, 0.12, 'square', 0.18, 0);
    sfx(784, 1046, 0.3, 'square', 0.2, 0.14);
  }
}

/* Altitude zones: fixed-size chapters. Leaving one is a celebration, and
   each new zone introduces a block type (Doodle Jump's roster, adapted).
   Max spec'd ~3000m zones — running 1500 while the block variety is
   validated; this constant is the only thing to change back. */
const ZONE_M = 500;   // validation size — Max's target is ~3000 once block variety is proven
const ZONES = [
  { name: 'THE COURTYARD',    top: '#0d1220', bot: '#18202f', block: null },
  { name: 'THE RAMPARTS',     top: '#0e1224', bot: '#1c2338', block: 'mover' },
  { name: 'THE CLOUDBANK',    top: '#101a2e', bot: '#2c3a57', block: 'crumble' },
  { name: 'THE HIGH SKY',     top: '#0a1226', bot: '#20355e', block: 'ghost' },
  { name: 'THE STARFIELD',    top: '#05070f', bot: '#0e1526', block: 'spring' },
  { name: "THE MOON'S REACH", top: '#020308', bot: '#090d18', block: 'slope' },
  { name: 'THE BEYOND',       top: '#010204', bot: '#04060c', block: null },
];
const BLOCK_LABEL = { mover: 'MOVING PLATFORMS', crumble: 'CRUMBLING PLATFORMS',
                      ghost: 'PHANTOM PLATFORMS', spring: 'SPRING PADS',
                      slope: 'SLOPED PLATFORMS' };

/* ================= Canvas / coords ================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let LH = 800, LW = 1600, cx = 800, scale = 1, dpr = 1;
let wasPortrait = null, orientFlip = false;
function resize(){
  const w = innerWidth, h = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.width = w * dpr; cv.height = h * dpr;
  const portrait = h > w;
  if (portrait) { LW = 800; scale = w / 800; LH = h / scale; }
  else          { LH = 800; scale = h / 800; LW = w / scale; }
  cx = LW / 2;
  if (wasPortrait !== null && wasPortrait !== portrait) orientFlip = true;
  wasPortrait = portrait;
}
addEventListener('resize', resize);
resize();

/* ================= State ================= */
const S_READY = 0, S_PLAY = 1;
let state = S_READY;
let bestAlt = +(sGet('lp-zig-best') || 0);
let coinsT = +(sGet('lp-coins') || 0);
let GROUND_Y = 700;
let camX = 0, camY = 0, peakY = 700, milestone = 0, jumpsLeft = 3, zoneIdx = 0;
let panelOpen = false, SIM = false, groundHit = false;
let parts = [], confetti = [], banner = null, zoneReached = 0, consecSpecial = 0;
tutIdx = sGet('lp-tut-done') ? -1 : 0;
/* Redo: when you're helpless (no slings, falling) and the projected landing
   costs real progress, time slows and you may undo back to your last footing.
   3 free per climb. Deliberately NOT monetized during playtesting. */
let lastSafe = { x: 0, y: 0 }, freeRedos = 3, redoPrompt = null, airPrompted = false;
let redoWallet = +(sGet('lp-redo-wallet') || 0), buying = 0;   // wallet persists; buys are TEST MODE (no real charge)
let timeScale = 1, projT = 0;
function redoCount(){ return freeRedos + redoWallet; }
const world = { flats:[], coins:[], flippers:[] };
let cursor = { x: 0, y: 0 }, dir = 1;
const ball = { x:0, y:0, vx:0, vy:0, trail:[] };
const aims = new Map();

function sGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function sSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function rnd(a,b){ return a + Math.random() * (b - a); }
function altOf(y){ return Math.max(0, Math.round((GROUND_Y - CFG.ballR - y) / 10)); }
function zoneAt(a){ return Math.min((a / ZONE_M) | 0, ZONES.length - 1); }
function lerpHex(c1, c2, t){
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
}

/* ================= Zigzag generation ================= */
function coinArcAt(ax, ay){
  const k = 3 + (Math.random() < 0.5 ? 1 : 0), arcH = rnd(28, 60);
  for (let i = 0; i < k; i++) {
    const u = 2 * i / (k - 1) - 1;
    world.coins.push({ x: ax + u * 56 * (k - 1) / 2, y: ay - arcH * (1 - u * u), got: false });
  }
}
function tierPick(a){
  const w = a < 120 ? [0.66, 0.26, 0.08] : a < 350 ? [0.5, 0.35, 0.15] : [0.42, 0.38, 0.20];
  const r = Math.random();
  return r < w[0] ? 0 : r < w[0] + w[1] ? 1 : 2;
}
function typeFor(a){
  const zi = zoneAt(a);
  const unlocked = ZONES.slice(1, zi + 1).map(z => z.block).filter(Boolean);
  if (!unlocked.length) return 'static';
  const newest = ZONES[zi].block;
  const r = Math.random();
  if (newest && r < 0.30) return newest;           // the zone's own block is the star
  let p = newest ? 0.30 : 0;
  for (const b of unlocked) {
    if (b === newest) continue;
    p += 0.12;
    if (r < p) return b;                            // older blocks keep appearing, rarer
  }
  return 'static';
}
function makePlat(px, py, w, a, forceStatic){
  let type = forceStatic ? 'static' : typeFor(a);
  if (type !== 'static' && consecSpecial >= 2) type = 'static';   // the ladder always keeps rungs
  consecSpecial = type === 'static' ? 0 : consecSpecial + 1;
  const f = { x0: px - w / 2, x1: px + w / 2, y: py, origY: py, type };
  if (type === 'mover') { f.cxr = px; f.w = w; f.range = rnd(70, 150); f.spd = rnd(0.6, 1.1); f.phase = rnd(0, 6.28); }
  if (type === 'crumble') { f.hitAt = 0; f.fallV = 0; }
  if (type === 'ghost') { f.usedAt = 0; f.fade = 1; }
  if (type === 'slope') {   // tilted slab: you slide toward the low edge until you act
    f.tilt = (Math.random() < 0.5 ? 1 : -1) * rnd(0.20, 0.42);
    const half = Math.max(30, w / 2 - 15);
    const dy = Math.tan(f.tilt) * half;
    f.lx = px - half; f.ly = py + dy;
    f.rx = px + half; f.ry = py - dy;
  }
  world.flats.push(f);
  return f;
}
function wallClimb(a){
  // a ladder of staggered wall slabs: kiss-reload your way up to a safe deck
  const n = 3 + (rnd(0, 3) | 0);
  const baseX = cursor.x;
  let side = Math.random() < 0.5 ? 1 : -1;
  let y = cursor.y - 260;
  for (let i = 0; i < n; i++) {
    const wh = rnd(160, 240), wx = baseX + side * rnd(70, 130);
    world.flats.push({ type: 'wall', x: wx, y0: y - wh, y1: y });
    if (Math.random() < 0.45) world.coins.push({ x: wx + side * 46, y: y - wh / 2, got: false });
    side = -side;
    y -= rnd(300, 380);
  }
  cursor = { x: baseX + rnd(-60, 60), y: y - rnd(60, 120) };
  makePlat(cursor.x, cursor.y, rnd(300, 380), a, true);   // the safe deck
  if (Math.random() < 0.4) coinArcAt(cursor.x, cursor.y - 90);
}
function genRun(){
  const a = altOf(cursor.y);
  if (zoneAt(a) >= 2 && Math.random() < 0.2) { wallClimb(a); return; }
  const steps = 4 + (rnd(0, 4) | 0);
  for (let i = 0; i < steps; i++) {
    const t = tierPick(a);
    const rise = TIERS[t] + rnd(-45, 5);
    const dx = dir * (t === 0 ? rnd(170, 300) : t === 1 ? rnd(200, 400) : rnd(240, 460));
    cursor = { x: cursor.x + dx, y: cursor.y - rise };
    makePlat(cursor.x, cursor.y, rnd(150, 250), a);
    const roll = Math.random();
    if (roll < 0.45) world.coins.push({ x: cursor.x, y: cursor.y - 52, got: false });
    else if (roll < 0.7) coinArcAt(cursor.x - dx / 2, cursor.y + rise / 2 - rnd(0, 50));
    // vertical wall slabs (zone 2+): thin mid-air surfaces — kiss one to reload your slings
    if (zoneAt(a) >= 2 && Math.random() < 0.15) {
      const wy = cursor.y - rnd(140, 340), wh = rnd(140, 260);
      world.flats.push({ type: 'wall', x: cursor.x + dir * rnd(130, 250), y0: wy - wh, y1: wy });
    }
    // pinball paddles (zone 3+): pivoting arms that swipe on their own clock.
    // 'up' bats you skyward; 'side' sweeps overhead; 'down' slams — beware
    if (zoneAt(a) >= 3 && Math.random() < 0.10) {
      const roll = Math.random();
      const kind = roll < 0.45 ? 'up' : roll < 0.75 ? 'side' : 'down';
      let restA, hitA;
      if (kind === 'up') { restA = 0.6; hitA = -0.7; }
      else if (kind === 'down') { restA = -0.6; hitA = 0.7; }
      else { restA = -Math.PI / 2 - 0.6; hitA = -Math.PI / 2 + 0.6; }
      const brutal = kind !== 'up' && Math.random() < 0.35;
      world.flippers.push({
        px: cursor.x - dx * 0.5 + (Math.random() < 0.5 ? -1 : 1) * rnd(120, 220),
        py: cursor.y + rise * 0.5 + rnd(-50, 50),
        m: Math.random() < 0.5 ? 1 : -1,
        len: rnd(120, 180), restA, hitA, angle: restA,
        dur: brutal ? 0.09 : 0.14, st: 0, t: rnd(0.5, 3), w: 0, kind, brutal });
    }
  }
  // wide turn platform: an easy step, a place to breathe, then reverse — always plain
  const rise = TIERS[0] + rnd(-40, 0);
  cursor = { x: cursor.x + dir * rnd(160, 260), y: cursor.y - rise };
  makePlat(cursor.x, cursor.y, rnd(260, 340), a, true);
  if (Math.random() < 0.4) coinArcAt(cursor.x, cursor.y - 90);
  dir = -dir;
}
function ensureWorld(){
  while (cursor.y > camY - 1400) genRun();
}

function reset(){
  GROUND_Y = LH - 100;
  world.flats = [{ x0: -1400, x1: 1400, y: GROUND_Y, ground: true }];
  world.coins = []; world.flippers = [];
  cursor = { x: 0, y: GROUND_Y }; dir = 1;
  ball.x = 0; ball.y = GROUND_Y - CFG.ballR - 1;
  ball.vx = 0; ball.vy = 0; ball.trail = [];
  camX = ball.x - LW / 2; camY = ball.y - LH * 0.55;
  peakY = ball.y; milestone = 0; zoneIdx = 0; zoneReached = 0; jumpsLeft = CFG.jumps;
  consecSpecial = 0; confetti = []; banner = null;
  lastSafe = { x: ball.x, y: ball.y }; freeRedos = 3; redoPrompt = null;
  airPrompted = false; timeScale = 1; projT = 0; buying = 0;
  aims.clear(); parts = [];
  state = S_READY;
  ensureWorld();
}

/* ================= Physics ================= */
function collideRect(b, rx, ry, rw, rh){
  const r = CFG.ballR;
  const nx0 = Math.max(rx, Math.min(b.x, rx + rw));
  const ny0 = Math.max(ry, Math.min(b.y, ry + rh));
  let dx = b.x - nx0, dy = b.y - ny0;
  const d2 = dx * dx + dy * dy;
  if (d2 > r * r) return;
  let nxx, nyy, pen;
  const d = Math.sqrt(d2);
  if (d > 1e-6) { nxx = dx / d; nyy = dy / d; pen = r - d; }
  else {
    const l = b.x - rx, rt = rx + rw - b.x, tp = b.y - ry, bt = ry + rh - b.y;
    const m = Math.min(l, rt, tp, bt);
    if (m === l)      { nxx = -1; nyy = 0; pen = l + r; }
    else if (m === rt){ nxx = 1;  nyy = 0; pen = rt + r; }
    else if (m === tp){ nxx = 0;  nyy = -1; pen = tp + r; }
    else              { nxx = 0;  nyy = 1;  pen = bt + r; }
  }
  bounce(b, nxx, nyy, pen);
}
function collideCap(b, f){   // ball vs tilted slab (capsule along the slope's spine)
  const R = CFG.ballR + 15;
  const dx = f.rx - f.lx, dy = f.ry - f.ly, l2 = dx * dx + dy * dy;
  let tt = l2 > 0 ? ((b.x - f.lx) * dx + (b.y - f.ly) * dy) / l2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  let nx = b.x - (f.lx + dx * tt), ny = b.y - (f.ly + dy * tt);
  const d = Math.hypot(nx, ny);
  if (d >= R || d < 1e-6) return;
  bounce(b, nx / d, ny / d, R - d);
}
function bounce(b, nx, ny, pen){
  b.x += nx * pen; b.y += ny * pen;
  if (ny < -0.55) groundHit = true;
  if (!SIM) jumpsLeft = CFG.jumps;   // touching anything reloads
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    let tvx = b.vx - vn * nx, tvy = b.vy - vn * ny;
    tvx *= 1 - CFG.rollFric; tvy *= 1 - CFG.rollFric;
    const bn = -vn * CFG.restitution;
    b.vx = tvx + nx * bn; b.vy = tvy + ny * bn;
    if (-vn > 300) sfx(150, 85, 0.05, 'square', Math.min(0.18, -vn / 9000));
  }
}
function physBall(b, dt){
  const r = CFG.ballR;
  b.vy += CFG.gravity * dt;
  const dmp = Math.exp(-CFG.damping * dt);
  b.vx *= dmp; b.vy *= dmp;
  b.x += b.vx * dt; b.y += b.vy * dt;
  groundHit = false;
  for (let it = 0; it < 2; it++) {
    for (const f of world.flats) {
      if (f.gone || f.solidOff) continue;
      if (f.ground) {   // the ground is infinite — it's always underneath you
        if (f.y <= b.y + r) collideRect(b, b.x - 2000, f.y, 4000, 600);
        continue;
      }
      if (f.type === 'wall') {
        if (f.y0 > b.y + r || f.y1 < b.y - r || f.x - 15 > b.x + r || f.x + 15 < b.x - r) continue;
        collideRect(b, f.x - 15, f.y0, 30, f.y1 - f.y0);
        continue;
      }
      if (f.type === 'slope') {
        if (Math.min(f.ly, f.ry) - 20 > b.y + r || Math.max(f.ly, f.ry) + 40 < b.y - r ||
            f.x0 > b.x + r || f.x1 < b.x - r) continue;
        collideCap(b, f);
        continue;
      }
      if (f.y > b.y + r || f.y + 30 < b.y - r || f.x0 > b.x + r || f.x1 < b.x - r) continue;
      collideRect(b, f.x0, f.y, f.x1 - f.x0, 30);
    }
  }
  for (const fl of world.flippers) {
    if (Math.abs(b.x - fl.px) > fl.len + 70 || Math.abs(b.y - fl.py) > fl.len + 70) continue;
    collideFlipper(b, fl);
  }
  // character-style skid: strong horizontal braking while on a surface
  if (groundHit) b.vx *= Math.exp(-CFG.groundFric * dt);
}

function updateFlippers(dt){
  for (const fl of world.flippers) {
    fl.t -= dt; fl.w = 0;
    if (fl.st === 0 && fl.t <= 0) { fl.st = 1; fl.t = 0.25; }                 // wind-up: the telegraph
    else if (fl.st === 1 && fl.t <= 0) { fl.st = 2; fl.t = fl.dur; }
    else if (fl.st === 2) {                                                    // the swipe
      const k = Math.max(0, Math.min(1, 1 - fl.t / fl.dur));
      fl.angle = fl.restA + (fl.hitA - fl.restA) * k;
      fl.w = (fl.hitA - fl.restA) / fl.dur;
      if (fl.t <= 0) { fl.st = 3; fl.t = 0.5; }
    } else if (fl.st === 3) {                                                  // lazy return
      const k = Math.max(0, Math.min(1, 1 - fl.t / 0.5));
      fl.angle = fl.hitA + (fl.restA - fl.hitA) * k;
      fl.w = (fl.restA - fl.hitA) / 0.5;
      if (fl.t <= 0) { fl.st = 0; fl.t = rnd(1.5, 4); fl.angle = fl.restA; }
    }
  }
}
function collideFlipper(b, fl){
  const R = CFG.ballR + 14;
  const ex = fl.px + fl.m * Math.cos(fl.angle) * fl.len;
  const ey = fl.py + Math.sin(fl.angle) * fl.len;
  const dx = ex - fl.px, dy = ey - fl.py, l2 = dx * dx + dy * dy;
  let tt = l2 ? ((b.x - fl.px) * dx + (b.y - fl.py) * dy) / l2 : 0;
  tt = Math.max(0.05, Math.min(1, tt));
  let nx = b.x - (fl.px + dx * tt), ny = b.y - (fl.py + dy * tt);
  const d = Math.hypot(nx, ny);
  if (d >= R || d < 1e-6) return;
  nx /= d; ny /= d;
  b.x += nx * (R - d); b.y += ny * (R - d);
  // the arm's surface velocity at the contact point is what bats you
  const arm = fl.len * tt;
  const vsx = fl.w * (-fl.m * Math.sin(fl.angle)) * arm;
  const vsy = fl.w * Math.cos(fl.angle) * arm;
  const rvx = b.vx - vsx, rvy = b.vy - vsy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    b.vx = rvx - 1.75 * vn * nx + vsx;
    b.vy = rvy - 1.75 * vn * ny + vsy;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 2600) { b.vx *= 2600 / sp; b.vy *= 2600 / sp; }
    if (!SIM) {
      jumpsLeft = CFG.jumps;   // a paddle is still a surface — slings reload
      sfx(Math.abs(fl.w) > 4 ? 180 : 150, Math.abs(fl.w) > 4 ? 60 : 85,
          Math.abs(fl.w) > 4 ? 0.12 : 0.05, 'square', Math.abs(fl.w) > 4 ? 0.25 : 0.12);
    }
  }
}

function projectLanding(){   // where does this fall end? (real physics, frozen movers)
  const b = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy };
  SIM = true;
  let ly = ball.y;
  for (let i = 0; i < 600; i++) {
    physBall(b, 1 / 120);
    ly = b.y;
    if (groundHit && b.vy <= 60) break;
  }
  SIM = false;
  return ly;
}
function closePrompt(){ redoPrompt = null; timeScale = 1; }
function doRedo(){
  if (redoCount() <= 0) return;
  if (freeRedos > 0) freeRedos--;
  else { redoWallet--; sSet('lp-redo-wallet', redoWallet); }
  ball.x = lastSafe.x; ball.y = lastSafe.y - 1;
  ball.vx = 0; ball.vy = 0; ball.trail = [];
  jumpsLeft = CFG.jumps;
  parts.push({ x: ball.x, y: ball.y - 80, t: 0, txt: '↺ REDO', col: '#5fd9e8' });
  sfx(300, 900, 0.25, 'sine', 0.2);
  closePrompt();
}

function step(dt){
  updateFlippers(dt);
  physBall(ball, dt);
  if (groundHit) {   // standing on anything: this is your footing, and the fall (if any) is over
    airPrompted = false;
    if (ball.vy > -50) lastSafe = { x: ball.x, y: ball.y };
    if (redoPrompt) closePrompt();
  }
  // helpless + falling + expensive projected landing -> offer the redo
  if (state === S_PLAY && !redoPrompt && !airPrompted &&
      jumpsLeft <= 0 && ball.vy > 320) {
    projT += dt;
    if (projT > 0.2) {
      projT = 0;
      const lossM = Math.round((projectLanding() - lastSafe.y) / 10);
      if (lossM > 120) {
        airPrompted = true;
        redoPrompt = { lossM, t: 0 };
        timeScale = 0.25;
        sfx(500, 180, 0.4, 'sawtooth', 0.18);
      }
    }
  } else projT = 0;

  // block behaviours
  const tNow = performance.now() / 1000;
  let support = null;
  for (const f of world.flats) {
    if (f.gone) continue;
    if (f.type === 'mover' && !f.falling) {
      const nx0 = f.cxr - f.w / 2 + Math.sin(tNow * f.spd + f.phase) * f.range;
      f.lastDx = nx0 - f.x0;
      f.x0 = nx0; f.x1 = nx0 + f.w;
    }
    if (!support && !f.ground && !f.solidOff && f.type !== 'slope' && f.type !== 'wall' &&
        ball.x > f.x0 - CFG.ballR * 0.6 && ball.x < f.x1 + CFG.ballR * 0.6 &&
        Math.abs(f.y - (ball.y + CFG.ballR)) < 7 && ball.vy >= -20) support = f;
  }
  if (support) {
    tutComplete('single');
    if (support.type === 'mover' && support.lastDx) ball.x += support.lastDx;   // ride it
    if (support.type === 'crumble' && !support.hitAt) { support.hitAt = tNow; sfx(220, 140, 0.12, 'square', 0.12); }
    if (support.type === 'ghost' && !support.usedAt) support.usedAt = tNow;
    if (support.type === 'spring' && (!support.sprAt || tNow - support.sprAt > 0.35)) {
      support.sprAt = tNow;
      ball.vy = -2500;   // a spring should out-lift your whole triple chain — a gift, not a shrug
      jumpsLeft = CFG.jumps;
      sfx(280, 1100, 0.25, 'triangle', 0.26);
    }
  }
  for (const f of world.flats) {
    if (f.type === 'crumble' && f.hitAt && !f.gone) {
      if (!f.falling && tNow - f.hitAt > 0.45) { f.falling = true; f.solidOff = true; f.fallV = 0; }
      if (f.falling) {
        f.fallV += 2000 * dt; f.y += f.fallV * dt;
        if (f.y > camY + LH + 300) { f.gone = true; f.respawnAt = tNow + 6; }
      }
    }
    if (f.type === 'ghost' && f.usedAt && !f.gone && tNow - f.usedAt > 0.6) {
      f.solidOff = true;
      f.fade -= dt * 3;
      if (f.fade <= 0) { f.gone = true; f.respawnAt = tNow + 8; }
    }
    // broken blocks grow back — falls must never strand you under holes you made
    if (f.gone && f.respawnAt && tNow > f.respawnAt) {
      f.gone = false; f.solidOff = false; f.respawnAt = 0;
      if (f.type === 'crumble') { f.y = f.origY; f.hitAt = 0; f.falling = false; f.fallV = 0; }
      if (f.type === 'ghost') { f.fade = 1; f.usedAt = 0; }
    }
  }

  camX += (ball.x - LW * 0.5 - camX) * Math.min(1, dt * 8);
  camY += (ball.y - LH * 0.55 - camY) * Math.min(1, dt * 8);
  ensureWorld();

  if (ball.y < peakY) peakY = ball.y;
  const alt = altOf(peakY);
  if (alt >= bestAlt) { bestAlt = alt; sSet('lp-zig-best', bestAlt); }
  const m = Math.floor(alt / 100);
  if (m > milestone) {
    milestone = m;
    parts.push({ x: ball.x, y: ball.y - 70, t: 0, txt: (m * 100) + 'm!', col: '#5fd9e8' });
    sfx(700, 1400, 0.2, 'sine', 0.2);
  }
  // zone celebration: first time the run's peak crosses a zone boundary
  const zPeak = zoneAt(altOf(peakY));
  if (zPeak > zoneReached) {
    zoneReached = zPeak;
    const zn2 = ZONES[zPeak];
    banner = { t: 0, txt: zn2.name, sub: zn2.block ? 'NEW BLOCK: ' + BLOCK_LABEL[zn2.block] : 'EVERYTHING THE TOWER HAS' };
    for (let i = 0; i < 46; i++)
      confetti.push({ x: ball.x + rnd(-40, 40), y: ball.y - 30, vx: rnd(-520, 520), vy: rnd(-850, -120),
                      s: rnd(4, 9), t: 0, col: ['#ffd166', '#5fd9e8', '#7fe3a0', '#ff8c5a'][i % 4] });
    sfx(523, 523, 0.12, 'square', 0.18, 0);
    sfx(659, 659, 0.12, 'square', 0.18, 0.13);
    sfx(784, 1046, 0.3, 'square', 0.2, 0.26);
  }
  zoneIdx = zoneAt(altOf(ball.y));

  for (const c of world.coins) {
    if (c.got || Math.hypot(ball.x - c.x, ball.y - c.y) > CFG.ballR + 17) continue;
    c.got = true; coinsT++; sSet('lp-coins', coinsT);
    parts.push({ x: c.x, y: c.y, t: 0, txt: '+1', col: '#ffd166' });
    sfx(880, 1420, 0.09, 'sine', 0.14);
  }
}

/* ================= Slingshot input ================= */
function pullOf(a){
  let dx = a.ax - a.x, dy = a.ay - a.y;
  const d = Math.hypot(dx, dy);
  if (d < 14) return null;
  const pull = Math.min(d, PULL_MAX);
  const used = Math.max(0, CFG.jumps - jumpsLeft);
  const mult = Math.pow(CFG.airDecay, used);
  const sp = Math.min(pull * CFG.slingPower, CFG.maxThrow) * mult;
  return { hx: ball.x - dx / d * pull, hy: ball.y - dy / d * pull,
           vx: dx / d * sp, vy: dy / d * sp };
}
function fire(a){
  const s = pullOf(a);
  if (!s) return;
  if (jumpsLeft <= 0) {
    parts.push({ x: ball.x, y: ball.y - 70, t: 0, txt: 'LAND TO RELOAD', col: '#ff5d5d' });
    sfx(160, 90, 0.15, 'square', 0.18);
    return;
  }
  jumpsLeft--;
  ball.vx = s.vx; ball.vy = s.vy;
  if (state === S_READY) state = S_PLAY;
  const used = CFG.jumps - jumpsLeft;
  if (used === 2) tutComplete('double');
  else if (used === 3) tutComplete('triple');
  const sp = Math.hypot(s.vx, s.vy);
  sfx(200 + Math.min(sp, 3000) * 0.15, 120, 0.09, 'triangle', 0.15);
}
function previewPts(a){
  const s = pullOf(a);
  if (!s) return [];
  const b = { x: ball.x, y: ball.y, vx: s.vx, vy: s.vy };
  const pts = [];
  SIM = true;
  for (let i = 0; i < 168; i++) {
    physBall(b, 1 / 120);
    if (i % 6 === 0) pts.push({ x: b.x, y: b.y });
  }
  SIM = false;
  return pts;
}

let ac = null;
function ensureAudio(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function sfx(f0, f1, dur, type, vol, delay){
  if (SIM || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (delay || 0);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(f0, 1), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch(e){}
}

function onStart(id, x, y){
  ensureAudio();
  if (redoPrompt) {
    if (buying > 0) return;   // mid "purchase": ignore taps
    const bw2 = Math.min(LW * 0.7, 520), bx2 = cx - bw2 / 2, by2 = LH * 0.40;
    if (x > bx2 && x < bx2 + bw2 && y > by2 && y < by2 + 86) {
      if (redoCount() > 0) doRedo();
      else {   // TEST-MODE purchase: count the tap, fake the processing, grant the pack
        sSet('lp-mock-buys', (+(sGet('lp-mock-buys') || 0)) + 1);
        buying = 0.9;
        redoPrompt.t = 0;
        sfx(600, 800, 0.08, 'sine', 0.12);
      }
      return;
    }
    closePrompt();   // riding it out — and the drag they just started can still aim a landing
  }
  aims.set(id, { ax: x, ay: y, x, y });
}
function onMove(id, x, y){
  const a = aims.get(id);
  if (a) { a.x = x; a.y = y; }
}
function onEnd(id){
  const a = aims.get(id);
  if (a) { fire(a); aims.delete(id); }
}
function lpos(e){ return { x: e.clientX / scale, y: e.clientY / scale }; }

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const p = lpos(t); onStart(t.identifier, p.x, p.y); }
}, { passive:false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const p = lpos(t); onMove(t.identifier, p.x, p.y); }
}, { passive:false });
for (const ev of ['touchend', 'touchcancel'])
  cv.addEventListener(ev, e => {
    e.preventDefault();
    for (const t of e.changedTouches) onEnd(t.identifier);
  }, { passive:false });

let mouseDown = false;
cv.addEventListener('mousedown', e => { mouseDown = true;  const p = lpos(e); onStart('m', p.x, p.y); });
cv.addEventListener('mousemove', e => { if (mouseDown)   { const p = lpos(e); onMove('m', p.x, p.y); } });
addEventListener('mouseup',      () => { if (mouseDown)   { mouseDown = false; onEnd('m'); } });

/* ================= Rendering ================= */
function makePattern(draw, w, h){
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  draw(t.getContext('2d'));
  return ctx.createPattern(t, 'repeat');
}
const checkerPat = makePattern(c => {
  c.fillStyle = '#7c4636'; c.fillRect(0, 0, 88, 88);
  c.fillStyle = '#69392c';
  c.fillRect(0, 0, 44, 44); c.fillRect(44, 44, 44, 44);
}, 88, 88);

const HUD = '"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif';
function txt(str, x, y, size, color, weight, align){
  ctx.font = (weight || 600) + ' ' + size + 'px ' + HUD;
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function drawBall(x, y, alpha){
  const r = CFG.ballR;
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
  g.addColorStop(0, '#fff3d0'); g.addColorStop(0.45, '#ffd166'); g.addColorStop(1, '#e09422');
  ctx.shadowColor = 'rgba(255,200,80,0.75)'; ctx.shadowBlur = 22;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function render(t){
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  // sky blends between zone palettes as you climb
  const a = altOf(ball.y);
  const zi = zoneAt(a);
  const zn = ZONES[Math.min(zi + 1, ZONES.length - 1)];
  const zt = zi === ZONES.length - 1 ? 0 : Math.max(0, Math.min(1, (a - zi * ZONE_M) / ZONE_M));
  const sky = ctx.createLinearGradient(0, 0, 0, LH);
  sky.addColorStop(0, lerpHex(ZONES[zi].top, zn.top, zt));
  sky.addColorStop(1, lerpHex(ZONES[zi].bot, zn.bot, zt));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, LW, LH);
  // stars fade in approaching the Starfield zone, whatever size zones are
  const starA = Math.max(0, Math.min(0.9, (a - 3.4 * ZONE_M) / (1.2 * ZONE_M)));
  if (starA > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * starA) + ')';
    for (let k = 0; k < 70; k++) {
      const sx = (k * 379.7) % LW;
      const sy = ((k * 613.3) - camY * 0.15) % LH;
      const yy = sy < 0 ? sy + LH : sy;
      ctx.globalAlpha = starA * (0.3 + ((k * 7) % 10) / 14);
      ctx.fillRect(sx, yy, 2.2, 2.2);
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(-camX, -camY);

  // altitude lines every 100m
  const first = Math.max(1, Math.ceil((GROUND_Y - CFG.ballR - (camY + LH)) / 1000));
  for (let k = first; ; k++) {
    const ly = GROUND_Y - CFG.ballR - k * 1000;
    if (ly < camY - 30) break;
    if (ly > camY + LH + 30) continue;
    ctx.strokeStyle = 'rgba(95,217,232,0.16)'; ctx.lineWidth = 2;
    ctx.setLineDash([14, 18]);
    ctx.beginPath(); ctx.moveTo(camX - 40, ly); ctx.lineTo(camX + LW + 40, ly); ctx.stroke();
    ctx.setLineDash([]);
    txt((k * 100) + 'm', camX + LW - 16, ly - 18, 22, 'rgba(95,217,232,0.5)', 700, 'right');
  }

  // platforms + ground
  for (const f of world.flats) {
    if (f.gone) continue;
    if (f.ground) {   // drawn to the edges of wherever the camera looks
      ctx.fillStyle = checkerPat;
      ctx.beginPath();
      ctx.rect(camX - 60, f.y, LW + 120, camY + LH + 80 - f.y);
      ctx.fill();
      ctx.strokeStyle = '#b06a4b'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(camX - 60, f.y + 3); ctx.lineTo(camX + LW + 60, f.y + 3); ctx.stroke();
      continue;
    }
    ctx.save();
    if (f.type === 'wall') {
      ctx.fillStyle = checkerPat;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(f.x - 15, f.y0, 30, f.y1 - f.y0, 12);
      else ctx.rect(f.x - 15, f.y0, 30, f.y1 - f.y0);
      ctx.fill();
      ctx.strokeStyle = '#b06a4b'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(f.x - 12, f.y0 + 8); ctx.lineTo(f.x - 12, f.y1 - 8); ctx.stroke();
      ctx.restore();
      continue;
    }
    if (f.type === 'slope') {
      const ang = Math.atan2(f.ry - f.ly, f.rx - f.lx);
      const len = Math.hypot(f.rx - f.lx, f.ry - f.ly) + 30;
      ctx.translate((f.lx + f.rx) / 2, (f.ly + f.ry) / 2);
      ctx.rotate(ang);
      ctx.fillStyle = checkerPat;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-len / 2, -15, len, 30, 12); else ctx.rect(-len / 2, -15, len, 30);
      ctx.fill();
      ctx.strokeStyle = '#d98f4f'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-len / 2 + 8, -12); ctx.lineTo(len / 2 - 8, -12); ctx.stroke();
      ctx.restore();
      continue;
    }
    if (f.type === 'crumble' && f.hitAt && !f.falling) ctx.translate(Math.sin(t * 60) * 3, 0);
    const slab = () => {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(f.x0, f.y, f.x1 - f.x0, 30, 12);
      else ctx.rect(f.x0, f.y, f.x1 - f.x0, 30);
    };
    if (f.type === 'ghost') {
      ctx.globalAlpha = 0.25 + 0.5 * Math.max(0, f.fade);
      ctx.fillStyle = '#dfe8ff';
      slab(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2.5;
      slab(); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.type === 'crumble') {
      ctx.fillStyle = '#6e4a34';
      slab(); ctx.fill();
      ctx.strokeStyle = '#4a2f21'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(f.x0 + (f.x1 - f.x0) * 0.30, f.y + 2); ctx.lineTo(f.x0 + (f.x1 - f.x0) * 0.42, f.y + 28);
      ctx.moveTo(f.x0 + (f.x1 - f.x0) * 0.68, f.y + 2); ctx.lineTo(f.x0 + (f.x1 - f.x0) * 0.58, f.y + 28);
      ctx.stroke();
      ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(f.x0 + 8, f.y + 3); ctx.lineTo(f.x1 - 8, f.y + 3); ctx.stroke();
    } else {
      ctx.fillStyle = checkerPat;
      slab(); ctx.fill();
      ctx.strokeStyle = f.type === 'mover' ? '#5fa8ff' : '#b06a4b'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(f.x0 + 8, f.y + 3); ctx.lineTo(f.x1 - 8, f.y + 3); ctx.stroke();
      if (f.type === 'mover') {
        ctx.fillStyle = '#5fa8ff';
        ctx.beginPath(); ctx.moveTo(f.x0 + 4, f.y + 15); ctx.lineTo(f.x0 + 16, f.y + 7); ctx.lineTo(f.x0 + 16, f.y + 23); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(f.x1 - 4, f.y + 15); ctx.lineTo(f.x1 - 16, f.y + 7); ctx.lineTo(f.x1 - 16, f.y + 23); ctx.closePath(); ctx.fill();
      }
      if (f.type === 'spring') {
        const mx = (f.x0 + f.x1) / 2;
        ctx.strokeStyle = '#c9ced9'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(mx - 10, f.y); ctx.lineTo(mx + 10, f.y - 5);
        ctx.lineTo(mx - 10, f.y - 10); ctx.lineTo(mx + 10, f.y - 15);
        ctx.stroke();
        ctx.fillStyle = '#ff5d5d';
        ctx.fillRect(mx - 16, f.y - 22, 32, 7);
      }
    }
    ctx.restore();
  }
  // coins
  for (const c of world.coins) {
    if (c.got) continue;
    const bob = 3 * Math.sin(t * 3 + c.x * 0.013);
    ctx.shadowColor = 'rgba(255,209,102,0.8)'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 14, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#e09422'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 7.5, 0, 7); ctx.stroke();
  }

  // pinball paddles
  for (const fl of world.flippers) {
    const ex = fl.px + fl.m * Math.cos(fl.angle) * fl.len;
    const ey = fl.py + Math.sin(fl.angle) * fl.len;
    if (fl.st === 1) {   // wind-up glow: the fair warning
      ctx.shadowColor = fl.kind === 'up' ? 'rgba(232,194,104,0.9)' : 'rgba(255,107,129,0.9)';
      ctx.shadowBlur = 18;
    }
    ctx.strokeStyle = fl.kind === 'up' ? '#e8c268' : fl.kind === 'side' ? '#c9ced9' : '#ff6b81';
    ctx.lineWidth = 26; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fl.px, fl.py); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.moveTo(fl.px, fl.py); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = fl.brutal ? '#ff5d5d' : '#8fa3c0';
    ctx.beginPath(); ctx.arc(fl.px, fl.py, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#0b0f19';
    ctx.beginPath(); ctx.arc(fl.px, fl.py, 4.5, 0, 7); ctx.fill();
    ctx.lineCap = 'butt';
  }

  // trail + ball + jump pips
  for (let i = 0; i < ball.trail.length; i++) {
    const p = ball.trail[i], f = (i + 1) / ball.trail.length;
    ctx.globalAlpha = 0.22 * f;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(p.x, p.y, CFG.ballR * 0.75 * f, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBall(ball.x, ball.y, 1);
  if (state === S_PLAY) {
    const teach = tutIdx >= 0 && (TUT[tutIdx].key === 'double' || TUT[tutIdx].key === 'triple');
    const pr = teach ? 8 : 4.5, gap = teach ? 26 : 16;
    if (teach) {   // spotlight the sling pips while they're the lesson
      ctx.strokeStyle = 'rgba(95,217,232,' + (0.5 + 0.4 * Math.sin(t * 5)) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(ball.x, ball.y - CFG.ballR - 16, 40, 0, 7); ctx.stroke();
      txt('YOUR SLINGS', ball.x, ball.y - CFG.ballR - 74, 22, '#5fd9e8', 700);
    }
    for (let i = 0; i < CFG.jumps; i++) {
      const px = ball.x + (i - (CFG.jumps - 1) / 2) * gap;
      ctx.fillStyle = i < jumpsLeft ? 'rgba(95,217,232,0.9)' : 'rgba(95,217,232,0.18)';
      ctx.beginPath(); ctx.arc(px, ball.y - CFG.ballR - 15, pr, 0, 7); ctx.fill();
    }
  }

  // active pull
  for (const [, a2] of aims) {
    const s = pullOf(a2);
    if (!s) continue;
    const ok = jumpsLeft > 0;
    const pts = previewPts(a2);
    ctx.fillStyle = ok ? '#ffd166' : '#67707f';
    for (let i = 0; i < pts.length; i++) {
      ctx.globalAlpha = (0.65 * (1 - i / pts.length) + 0.08) * (ok ? 1 : 0.45);
      ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 5.5 - 2.5 * i / pts.length, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ok ? 'rgba(255,209,102,0.45)' : 'rgba(120,130,145,0.4)';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(s.hx, s.hy); ctx.stroke();
    ctx.lineCap = 'butt';
    drawBall(s.hx, s.hy, ok ? 0.45 : 0.2);
    if (!ok) txt('LAND TO RELOAD', ball.x, ball.y - 64, 22, '#ff5d5d', 700);
  }

  // confetti + particles
  for (const c of confetti) {
    ctx.globalAlpha = Math.max(0, 1 - c.t / 1.6);
    ctx.fillStyle = c.col;
    ctx.fillRect(c.x, c.y, c.s, c.s);
  }
  ctx.globalAlpha = 1;
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    txt(p.txt, p.x, p.y - p.t * 45, 40, p.col || '#7fe3a0', 700);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD — the big number is where you ARE (it falls with you); peak is the run's score
  const cur = altOf(ball.y), peak = altOf(peakY);
  txt(cur + 'm', cx, 48, 54, 'rgba(255,255,255,0.92)', 700);
  txt(ZONES[zoneIdx].name, cx, 88, 22, 'rgba(255,209,102,0.75)', 700);
  txt('PEAK ' + peak + 'm', LW - 110, 30, 22, 'rgba(143,163,192,0.85)', 600, 'right');
  if (state === S_PLAY) {   // redo hearts: your undo lives
    for (let i = 0; i < 3; i++) {
      const hx = LW - 172 + i * 26, hy = 58, s = 9;
      const on = i < freeRedos;
      ctx.fillStyle = on ? '#ff6b81' : 'rgba(255,107,129,0.18)';
      ctx.strokeStyle = 'rgba(255,107,129,0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hx, hy + s * 0.9);
      ctx.bezierCurveTo(hx - s * 1.1, hy + s * 0.2, hx - s * 0.55, hy - s * 0.7, hx, hy - s * 0.15);
      ctx.bezierCurveTo(hx + s * 0.55, hy - s * 0.7, hx + s * 1.1, hy + s * 0.2, hx, hy + s * 0.9);
      ctx.closePath();
      ctx.fill();
      if (!on) ctx.stroke();
    }
    if (redoWallet > 0) txt('+' + redoWallet, LW - 138, 58, 20, '#ff6b81', 700, 'left');
  }
  txt('BEST ' + bestAlt + 'm', 18, 30, 22, 'rgba(143,163,192,0.85)', 600, 'left');
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(27, 66, 9, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e09422'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(27, 66, 4.5, 0, 7); ctx.stroke();
  txt(String(coinsT), 44, 66, 22, '#ffd166', 700, 'left');

  // lost at the bottom: point the way back to the tower's lowest rung
  if (state === S_PLAY && ball.y > GROUND_Y - 300) {
    let vis = false, target = null, ty = -1e9;
    for (const f of world.flats) {
      if (f.ground || f.type === 'wall') continue;
      if (f.x1 > camX && f.x0 < camX + LW && f.y > camY && f.y < camY + LH) { vis = true; break; }
      if (f.y > ty) { ty = f.y; target = f; }
    }
    if (!vis && target) {
      const dirTo = (target.x0 + target.x1) / 2 > ball.x ? 1 : -1;
      const ax = dirTo > 0 ? LW - 90 : 90;
      ctx.globalAlpha = 0.55 + 0.4 * Math.sin(t * 4);
      ctx.fillStyle = '#5fd9e8';
      for (let k = 0; k < 3; k++) {
        const ox = ax + k * 20 * dirTo;
        ctx.beginPath();
        ctx.moveTo(ox + 12 * dirTo, LH * 0.5);
        ctx.lineTo(ox - 6 * dirTo, LH * 0.5 - 14);
        ctx.lineTo(ox - 6 * dirTo, LH * 0.5 + 14);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
      txt('THE TOWER', ax + 20 * dirTo, LH * 0.5 + 38, 18, 'rgba(95,217,232,0.8)', 700);
    }
  }

  if (redoPrompt) {
    ctx.fillStyle = 'rgba(6,9,16,0.55)';
    ctx.fillRect(0, 0, LW, LH);
    txt('BIG FALL INCOMING', cx, LH * 0.26, 54, '#ff5d5d', 800);
    txt('YOU’RE ABOUT TO DROP ~' + redoPrompt.lossM + 'm', cx, LH * 0.33, 28, '#e6ecf5', 600);
    const bw2 = Math.min(LW * 0.7, 520), bx2 = cx - bw2 / 2, by2 = LH * 0.40;
    const total = redoCount();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx2, by2, bw2, 86, 16); else ctx.rect(bx2, by2, bw2, 86);
    if (buying > 0) {
      ctx.fillStyle = 'rgba(230,236,245,0.25)';
      ctx.fill();
      txt('PROCESSING…', cx, by2 + 43, 28, '#e6ecf5', 800);
    } else if (total > 0) {
      ctx.fillStyle = 'rgba(95,217,232,0.18)';
      ctx.strokeStyle = '#5fd9e8'; ctx.lineWidth = 3;
      ctx.fill(); ctx.stroke();
      txt('REDO LAST JUMP  (' + total + ' LEFT)', cx, by2 + 43, 30, '#5fd9e8', 800);
    } else {
      ctx.fillStyle = '#f4f6fa';
      ctx.fill();
      txt(' Pay  ·  5 REDOS — $0.99', cx, by2 + 43, 30, '#0b0f19', 800);
    }
    // the decision window, draining before your eyes
    const limit = redoCount() > 0 && buying <= 0 ? 3 : 4.5;
    const rem = Math.max(0, 1 - redoPrompt.t / limit);
    ctx.fillStyle = 'rgba(143,163,192,0.25)';
    ctx.fillRect(bx2, by2 + 98, bw2, 6);
    ctx.fillStyle = rem > 0.4 ? '#5fd9e8' : '#ff5d5d';
    ctx.fillRect(bx2, by2 + 98, bw2 * rem, 6);
    txt('OR TAP ANYWHERE ELSE TO RIDE IT OUT', cx, by2 + 128, 20, 'rgba(143,163,192,0.8)', 600);
  }

  if (banner) {
    const aB = banner.t < 0.25 ? banner.t / 0.25 : banner.t > 2.1 ? Math.max(0, (2.6 - banner.t) / 0.5) : 1;
    ctx.globalAlpha = aB;
    txt(banner.txt, cx, LH * 0.30, 64, '#ffd166', 800);
    txt(banner.sub, cx, LH * 0.375, 26, '#5fd9e8', 700);
    ctx.globalAlpha = 1;
  }

  if (state === S_READY) {
    txt('LAST PASS', cx, LH * 0.24, 80, '#ffd166', 800);
    txt('DRAG ANYWHERE TO AIM — THE DOTS SHOW YOUR FLIGHT — RELEASE TO SLING.', cx, LH * 0.345, 25, '#cfd9ea');
    txt('THREE SLINGS PER LANDING, EACH WEAKER. NO DEATHS — JUST THE LONG WAY DOWN.', cx, LH * 0.39, 25, '#cfd9ea');
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
    txt('PULL BACK AND RELEASE TO JUMP', cx, LH * 0.465, 27, '#5fd9e8', 700);
    ctx.globalAlpha = 1;
    // what's-new callout for playtesters
    const latest = CHANGELOG[0];
    if (latest.highlights.length) {
      const hot = unseenLog;
      txt('NEW IN v' + latest.v, cx, LH * 0.575, 22, hot ? '#ffd166' : 'rgba(143,163,192,0.75)', 800);
      for (let i = 0; i < latest.highlights.length; i++)
        txt(latest.highlights[i], cx, LH * (0.615 + i * 0.038), 20,
            hot ? 'rgba(255,209,102,0.85)' : 'rgba(143,163,192,0.65)', 600);
      txt('FULL CHANGELOG IN THE ⚙ MENU', cx, LH * (0.615 + latest.highlights.length * 0.038 + 0.01), 16,
          'rgba(143,163,192,0.5)', 600);
    }
    txt('v' + VERSION, 14, LH - 18, 17, 'rgba(143,163,192,0.5)', 600, 'left');
  }
  // first-moves tutorial: a proper how-to-play card, big enough to matter,
  // parked in the upper third so the ball and your arcs stay visible
  if (tutIdx >= 0 && state === S_PLAY) {
    const st = TUT[tutIdx];
    const bw = Math.min(LW * 0.9, 980), bx = cx - bw / 2, by = LH * 0.135;
    const bh = 140 + st.lines.length * 34;
    ctx.fillStyle = 'rgba(6,9,16,0.55)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 18); else ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.strokeStyle = 'rgba(95,217,232,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 18); else ctx.rect(bx, by, bw, bh);
    ctx.stroke();
    txt('HOW TO PLAY — STEP ' + (tutIdx + 1) + ' OF ' + TUT.length, cx, by + 28, 19, 'rgba(143,163,192,0.9)', 700);
    txt(st.name, cx, by + 68, 44, '#ffd166', 800);
    for (let i = 0; i < st.lines.length; i++)
      txt(st.lines[i], cx, by + 106 + i * 34, 25, '#e6ecf5', 600);
    for (let i = 0; i < TUT.length; i++) {
      ctx.fillStyle = i < tutIdx ? '#7fe3a0' : i === tutIdx ? '#5fd9e8' : 'rgba(143,163,192,0.3)';
      ctx.beginPath(); ctx.arc(cx + (i - (TUT.length - 1) / 2) * 26, by + bh - 20, 5.5, 0, 7); ctx.fill();
    }
  }
  if (panelOpen) txt('PAUSED — TUNING', cx, 150, 24, '#5fd9e8', 700);
}

/* ================= Main loop ================= */
let tPrev = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - tPrev) / 1000; tPrev = now;
  if (dt > 0.05) dt = 0.05;
  const rdt = dt;
  dt *= timeScale;   // the redo moment plays out in slow motion
  if (redoPrompt && (redoPrompt.t += rdt) > (redoCount() > 0 && buying <= 0 ? 3 : 4.5)) closePrompt();
  if (buying > 0) {
    buying -= rdt;
    if (buying <= 0) {
      buying = 0;
      redoWallet += 5;
      sSet('lp-redo-wallet', redoWallet);
      if (redoPrompt) redoPrompt.t = 0;
      parts.push({ x: ball.x, y: ball.y - 90, t: 0, txt: '+5 REDOS (TEST — NO CHARGE)', col: '#7fe3a0' });
      sfx(523, 1046, 0.25, 'sine', 0.2);
    }
  }
  if (orientFlip) { orientFlip = false; reset(); }
  if (!panelOpen) {
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
  }
  if ((ball.vx * ball.vx + ball.vy * ball.vy) > 200 * 200) ball.trail.push({ x: ball.x, y: ball.y });
  else ball.trail.length = 0;
  if (ball.trail.length > 16) ball.trail.shift();
  for (const p of parts) p.t += dt;
  parts = parts.filter(p => p.t < 0.9);
  for (const c of confetti) { c.t += dt; c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; }
  confetti = confetti.filter(c => c.t < 1.6);
  if (banner && (banner.t += dt) > 2.6) banner = null;
  render(now / 1000);
}

/* ================= Tuning panel ================= */
const rows = document.getElementById('rows');
for (const [key, label, min, max, stp] of TUNE) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label');
  const name = document.createElement('span'); name.textContent = label;
  const out = document.createElement('output'); out.textContent = CFG[key];
  lab.append(name, out);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = stp; inp.value = CFG[key];
  inp.addEventListener('input', () => { CFG[key] = +inp.value; out.textContent = inp.value; });
  row.append(lab, inp);
  rows.append(row);
}
const panel = document.getElementById('panel');
const gear = document.getElementById('gear');
gear.addEventListener('click', () => {
  if (redoPrompt) closePrompt();   // the redo moment exists only in real time — pausing forfeits it
  panelOpen = !panelOpen;
  panel.classList.toggle('open', panelOpen);
});
document.getElementById('restart').addEventListener('click', () => {
  reset(); panelOpen = false; panel.classList.remove('open');
});

/* ---- changelog ---- */
let unseenLog = sGet('lp-seen-ver') !== VERSION;
gear.classList.toggle('unseen', unseenLog);
const logEl = document.getElementById('log'), logBody = document.getElementById('logbody');
for (const e of CHANGELOG) {
  const div = document.createElement('div');
  div.className = 'entry';
  const h3 = document.createElement('h3');
  h3.textContent = 'v' + e.v + ' — ' + e.title;
  const dd = document.createElement('div');
  dd.className = 'date'; dd.textContent = e.date;
  const ul = document.createElement('ul');
  for (const it of e.items) {
    const li = document.createElement('li');
    li.textContent = it;
    ul.append(li);
  }
  div.append(h3, dd, ul);
  logBody.append(div);
}
document.getElementById('whatsnew').addEventListener('click', () => {
  panelOpen = false; panel.classList.remove('open');
  logEl.classList.add('open');
  sSet('lp-seen-ver', VERSION);
  unseenLog = false;
  gear.classList.remove('unseen');
});
document.getElementById('logclose').addEventListener('click', () => logEl.classList.remove('open'));

reset();
requestAnimationFrame(frame);
</script>
